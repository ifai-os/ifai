# Cloudflare Tunnel：@PUBLIC_HOST@ → 本机的 Inngest（install.sh 填好后放到 ~/.ifai-inngest/）。
# 只放网站要用的接口：发事件 /e/、登记任务 /fn/、运行中的读写 /v1/ 和 /v0/runs/。这些都要密钥。
# 控制台和它的 /v0/gql 不验身份，所以不对外，只在 Mac Studio 本机（或局域网）打开。
tunnel: @TUNNEL_ID@
credentials-file: @CREDENTIALS@
# 走 HTTP/2（TCP 443）：Mac Studio 所在的网络挡了 QUIC（UDP 7844），默认的 QUIC 连不上，隧道会一直 530
protocol: http2
ingress:
  - hostname: @PUBLIC_HOST@
    path: ^/(e|fn|v1)/|^/v0/runs/
    service: http://127.0.0.1:8288
  - service: http_status:404
