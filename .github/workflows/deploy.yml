name: Deploy

# Vercel Hobby can't import a private organisation repo, so GitHub Actions builds
# and deploys with the Vercel CLI instead of the Vercel Git integration.
#   push to main  → main's preview: a long-lived Neon branch (preview/main, migrated on every merge)
#                   and a fixed address that moves to each new deployment; production too once
#                   PRODUCTION_DEPLOY is true
#   pull request  → preview deployment with its own Neon branch, then the smoke tests against it; the
#                   branch is copied again first if it has applied a migration the PR no longer has
#   PR closed     → the PR's Neon branch is deleted
#   every run     → first deletes the Neon branches of any other closed PRs left behind
# Secrets (repository → Settings → Secrets and variables → Actions), see docs/setup.md step 3:
# VERCEL_TOKEN, NEON_API_KEY, NEON_PROJECT_ID and, if previews are protected, VERCEL_AUTOMATION_BYPASS_SECRET.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  # Never cancel a production deployment halfway through its migrations.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Not secret: they only say which Vercel project to deploy to. Repository variables override them.
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID || 'team_5ej7Y4L2sAmq0AqIlyXG4sHI' }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || 'prj_75LhQzJ83dQTRSSvmxhosJkobFGh' }}
  VERCEL_CLI: vercel@63.1.2
  NEON_BRANCH: preview/pr-${{ github.event.pull_request.number }}

jobs:
  # Decides what to deploy (the deploy job's matrix). Until the secrets are filled in, it skips
  # deploying instead of failing every run.
  config:
    name: Check secrets
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.check.outputs.targets }}
      smoke: ${{ steps.check.outputs.smoke }}
    steps:
      - id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
          PRODUCTION_DEPLOY: ${{ vars.PRODUCTION_DEPLOY }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PREVIEW_UNPROTECTED: ${{ vars.PREVIEW_UNPROTECTED }}
          # main's preview lives at this fixed address; a repository variable can change it.
          MAIN_PREVIEW_DOMAIN: ${{ vars.MAIN_PREVIEW_DOMAIN || 'ifai-preview-ifai1.vercel.app' }}
        run: |
          # Previews sit behind Vercel Deployment Protection, so the smoke tests need the bypass secret,
          # unless the repository variable PREVIEW_UNPROTECTED says protection is off.
          if [ -n "$BYPASS" ] || [ "$PREVIEW_UNPROTECTED" = true ]; then
            echo "smoke=true" >> "$GITHUB_OUTPUT"
          elif [ "$IS_PR" = true ]; then
            echo "::notice::Skipping preview smoke tests: VERCEL_AUTOMATION_BYPASS_SECRET is not set (see docs/setup.md step 3)."
          fi
          missing=()
          [ -n "$VERCEL_TOKEN" ] || missing+=(VERCEL_TOKEN)
          [ -n "$NEON_API_KEY" ] || missing+=(NEON_API_KEY)
          [ -n "$NEON_PROJECT_ID" ] || missing+=(NEON_PROJECT_ID)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::notice::Not deploying: missing secrets ${missing[*]} (see docs/setup.md step 3)."
            echo "targets=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$IS_PR" = true ]; then
            targets=$(jq -cn --arg branch "$NEON_BRANCH" \
              '[{label: "preview", target: "preview", neon_branch: $branch}]')
          else
            targets=$(jq -cn --arg domain "$MAIN_PREVIEW_DOMAIN" \
              '[{label: "main preview", target: "preview", neon_branch: "preview/main", domain: $domain}]')
            # Production stays off until the repository variable PRODUCTION_DEPLOY is set to true.
            if [ "$PRODUCTION_DEPLOY" = true ]; then
              targets=$(jq -c '. + [{label: "production", target: "production"}]' <<<"$targets")
            else
              echo "::notice::Not deploying to production: repository variable PRODUCTION_DEPLOY is not true (see docs/setup.md step 3)."
            fi
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to ${{ matrix.label }}
    needs: [config, prune]
    if: needs.config.outputs.targets != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # main's preview and production deploy side by side; one failing doesn't cancel the other.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.config.outputs.targets) }}
    environment:
      name: ${{ matrix.target == 'production' && 'Production' || 'Preview' }}
      url: ${{ steps.deploy.outputs.url }}
    # Read only by the smoke tests, which run for pull requests, where there is a single target.
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      sha: ${{ steps.sha.outputs.sha }}
    env:
      TARGET: ${{ matrix.target }}
      PROD_FLAG: ${{ matrix.target == 'production' && '--prod' || '' }}
      DOMAIN: ${{ matrix.domain }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      # Check out the branch itself (not the PR merge commit) so the Vercel CLI records the
      # branch name and commit, like a Git-integration deployment would.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref }}

      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Vercel CLI
        run: npm install --global "$VERCEL_CLI"

      # Each preview gets its own copy of the database, branched from Neon's default (production)
      # branch the first time: preview/pr-<n> for a PR, preview/main for main. Later runs reuse the
      # branch, so its data survives pushes to the PR and, for main, every merge.
      - name: Neon branch ${{ matrix.neon_branch }}
        id: neon
        if: matrix.neon_branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ${{ matrix.neon_branch }}

      # A PR that regenerates its migration after main moves (docs/status.md, 已知问题) leaves the old
      # one applied on its reused branch under a name the code no longer has, and migrating again then
      # fails on CREATE statements that already ran ("type ... already exists"). So when the branch has
      # applied a migration that src/migrations no longer has, it is deleted and copied again from Neon's
      # default branch (as the first time) and the build migrates the clean copy. Whatever was
      # written on that PR's preview is lost. Only ever a PR's own branch: never preview/main or production.
      - name: Compare ${{ matrix.neon_branch }}'s migrations with this commit's
        id: migrations
        if: github.event_name == 'pull_request' && startsWith(matrix.neon_branch, 'preview/pr-') && steps.neon.outputs.created != 'true'
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: |
          table=$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "select to_regclass('public.payload_migrations') is not null")
          applied=""
          if [ "$table" = t ]; then
            applied=$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "select name from payload_migrations where name <> 'dev'")
          fi
          stale=$(comm -23 <(sed '/^$/d' <<<"$applied" | sort -u) \
            <(find src/migrations -maxdepth 1 -name '*.ts' ! -name index.ts -exec basename {} .ts \; | sort -u) | paste -sd ' ')
          if [ -z "$stale" ]; then
            echo "Every migration applied on $NEON_BRANCH is still in src/migrations; keeping the branch."
            exit 0
          fi
          echo "::notice::Recreating $NEON_BRANCH: it has applied migrations this commit no longer has: $stale"
          echo "Recreated $NEON_BRANCH (applied migrations no longer in the code: $stale)." >> "$GITHUB_STEP_SUMMARY"
          echo "reset=true" >> "$GITHUB_OUTPUT"

      # Not Neon's "reset from parent": it counts against the project's branch limit and fails with
      # "branches limit exceeded" once that is full. Deleting first frees the slot the new copy takes.
      # The new branch has a new host and password, so Build and Deploy read its outputs instead.
      - name: Delete ${{ matrix.neon_branch }}
        if: steps.migrations.outputs.reset == 'true'
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ steps.neon.outputs.branch_id }}

      - name: Neon branch ${{ matrix.neon_branch }}, copied again
        id: fresh
        if: steps.migrations.outputs.reset == 'true'
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ${{ matrix.neon_branch }}

      # If Neon still listed the old branch, the action above reused it instead of copying a new one.
      - name: Check ${{ matrix.neon_branch }} is a new copy
        if: steps.migrations.outputs.reset == 'true' && steps.fresh.outputs.created != 'true'
        run: |
          echo "::error::$NEON_BRANCH was not deleted in time and got reused; run the deployment again."
          exit 1

      - name: Pull Vercel settings and ${{ env.TARGET }} environment variables
        run: vercel pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"

      # `pnpm run ci` (vercel.json) migrates the database, then builds. Variables set here win over the
      # pulled ones, so a preview migrates and builds against its own Neon branch, never production.
      # (Only when there is a branch: even an empty DATABASE_URI here would hide the pulled one.)
      # main's preview also learns its fixed address, for links and sign-in (src/lib/site-url.ts).
      - name: Build
        env:
          NEON_DATABASE_URI: ${{ steps.fresh.outputs.db_url_pooled || steps.neon.outputs.db_url_pooled }}
        run: |
          if [ -n "$NEON_DATABASE_URI" ]; then export DATABASE_URI="$NEON_DATABASE_URI"; fi
          if [ -n "$DOMAIN" ]; then export PREVIEW_SITE_URL="https://$DOMAIN"; fi
          vercel build $PROD_FLAG --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        env:
          NEON_DATABASE_URI: ${{ steps.fresh.outputs.db_url_pooled || steps.neon.outputs.db_url_pooled }}
        run: |
          # One archive instead of thousands of files: Hobby allows 5000 uploaded files a day (api-upload-free).
          args=(--prebuilt --archive=tgz $PROD_FLAG --token="$VERCEL_TOKEN")
          # The preview's functions read the same Neon branch (and fixed address) at runtime.
          if [ -n "$NEON_DATABASE_URI" ]; then args+=(--env "DATABASE_URI=$NEON_DATABASE_URI"); fi
          if [ -n "$DOMAIN" ]; then args+=(--env "PREVIEW_SITE_URL=https://$DOMAIN"); fi
          url=$(vercel deploy "${args[@]}")
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
          # main's preview: move the fixed address to the new deployment.
          if [ -n "$DOMAIN" ]; then
            vercel alias set "$url" "$DOMAIN" --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"
            url="https://$DOMAIN"
            echo "Fixed address: $url" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

  # The same Playwright smoke tests as CI, against the preview that was just deployed.
  smoke:
    name: Preview smoke tests
    needs: [config, deploy]
    if: github.event_name == 'pull_request' && needs.config.outputs.smoke == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_URL: ${{ needs.deploy.outputs.url }}
      # Needed only if Vercel Deployment Protection is on for previews (docs/setup.md step 3).
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      E2E_ADMIN: '1'
      # Tests that only hold on production (robots.txt) check the preview's behaviour instead.
      E2E_PREVIEW: '1'

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.deploy.outputs.sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - name: Smoke tests against ${{ env.BASE_URL }}
        run: pnpm test:e2e

      # No report upload here: Playwright writes request headers into the call log of a failed API
      # request, so the HTML report could carry the bypass secret. The job log masks it; read failures there.

  cleanup:
    name: Delete the PR's Neon branch
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-24.04
    steps:
      - name: Check secrets
        id: check
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: echo "ready=$([ -n "$NEON_API_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Fails harmlessly if the PR never got a branch (for example, closed before the secrets existed).
      - uses: neondatabase/delete-branch-action@v3
        if: steps.check.outputs.ready == 'true'
        continue-on-error: true
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ env.NEON_BRANCH }}

  # The branch limit is small (10 on Neon's free plan), and a branch left behind by a failed cleanup
  # run, or by a PR closed before the secrets existed, keeps its slot until someone deletes it by hand.
  # So every run first deletes the preview/pr-<n> branches whose pull request is no longer open, and
  # the deploy job waits for it: a new PR's branch then finds a free slot. Only names of exactly that
  # form: preview/main and production never match. A failure here never holds up a deployment.
  prune:
    name: Delete Neon branches of closed PRs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      pull-requests: read
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete leftover preview branches
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            echo "::notice::Not pruning: NEON_API_KEY or NEON_PROJECT_ID is not set."
            exit 0
          fi
          api="https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID"
          neon() {
            curl -fsS -H "Authorization: Bearer $NEON_API_KEY" -H 'Accept: application/json' "$@"
          }
          neon "$api/branches" \
            | jq -r '.branches[] | select(.name | test("^preview/pr-[1-9][0-9]*$")) | "\(.id) \(.name)"' \
            | while read -r id name; do
                pr=${name#preview/pr-}
                state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq .state 2>/dev/null || echo unknown)
                # Kept unless GitHub says for sure that the PR is closed (merged counts as closed).
                if [ "$state" != closed ]; then
                  echo "$name: PR #$pr is $state, keeping it."
                  continue
                fi
                # The cleanup job above may have just deleted this PR's own branch.
                if neon -X DELETE "$api/branches/$id" >/dev/null; then
                  echo "Deleted $name (PR #$pr is closed)." | tee -a "$GITHUB_STEP_SUMMARY"
                else
                  echo "::warning::Could not delete $name (already gone?)."
                fi
              done
