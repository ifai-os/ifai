name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks, build and smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    # Throwaway Postgres (with pgvector, like Neon) so migrations and /admin are tested for real.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ifai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # CI-only placeholder values. Real secrets live in Vercel, never in this repo.
    env:
      DATABASE_URI: postgres://postgres:postgres@localhost:5432/ifai
      PAYLOAD_SECRET: ci-only-payload-secret-not-used-anywhere-else
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-not-used-anywhere-else
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
      # Builds with every module up to phase three (the Wiki), so the smoke tests cover them before launch.
      # Phase one's navigation is covered by the unit tests (tests/unit/site-config.test.ts).
      NEXT_PUBLIC_SITE_PHASE: '3'
      # The subscribe boxes and endpoints, for the smoke tests. Without Resend the emails only go to the server log.
      DAILY_EMAIL_ENABLED: 'true'
      # Signs the smoke tests' fake Resend webhooks (base64 of a made-up string).
      RESEND_WEBHOOK_SECRET: whsec_Y2ktb25seS13ZWJob29rLXNlY3JldC1ub3QtdXNlZC1hbnl3aGVyZQ==

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Translations (keys complete, zh-Hant up to date)
        run: pnpm i18n:check

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Migrations apply to an empty database
        run: pnpm payload migrate

      # Stories first, so the apps seed can match the stories that mention the sample apps; the Wiki last,
      # so its entries can link the sample apps, Skills and stories.
      - name: Sample stories, apps, Skills and Wiki entries for the smoke tests
        run: |
          pnpm payload run scripts/seed-stories.ts
          pnpm payload run scripts/seed-apps.ts
          pnpm payload run scripts/seed-skills.ts
          pnpm payload run scripts/seed-wiki.ts

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke tests
        run: pnpm test:e2e
        env:
          E2E_ADMIN: '1'
          E2E_SAMPLE_APPS: '1'
          E2E_SAMPLE_SKILLS: '1'
          E2E_SAMPLE_STORIES: '1'
          E2E_SAMPLE_WIKI: '1'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
